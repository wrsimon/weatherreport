<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f3d6e" />
  <title>氣象海象與防災資訊整合入口 | LINE LIFF & 跨裝置工作台</title>
  <!-- 引入 LINE 官方 LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/2.22.3/sdk.js"></script>
  <style>
    /* ==================== 1. 全域變數與主題系統（支援淺色 / 深色模式） ==================== */
    :root {
      --bg-page: #f0f5fa;
      --bg-header: linear-gradient(135deg, #0b2f59 0%, #145494 55%, #1d74b8 100%);
      --bg-surface: #ffffff;
      --bg-surface-soft: #f7fafd;
      --bg-pill: #e6eef7;
      --bg-pill-hover: #d7e5f4;
      --text-primary: #14263d;
      --text-secondary: #4e647d;
      --text-muted: #788ca3;
      --border-color: #dce6f0;
      --accent-blue: #1565c0;
      --accent-teal: #00897b;
      --accent-orange: #e65100;
      --accent-red: #c62828;
      --accent-line: #06c755;
      --shadow-sm: 0 2px 6px rgba(15, 45, 80, 0.05);
      --shadow-md: 0 8px 20px rgba(15, 45, 80, 0.09);
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --focus-ring: 0 0 0 3px rgba(21, 101, 192, 0.28);
    }

    html[data-theme="dark"] {
      --bg-page: #0c1724;
      --bg-header: linear-gradient(135deg, #081a33 0%, #0f335c 55%, #134a82 100%);
      --bg-surface: #132234;
      --bg-surface-soft: #182b40;
      --bg-pill: #1b314a;
      --bg-pill-hover: #24405f;
      --text-primary: #eaf2fb;
      --text-secondary: #aec2d8;
      --text-muted: #7f97b2;
      --border-color: #243b55;
      --accent-blue: #58a6ff;
      --accent-teal: #3ddbd9;
      --accent-orange: #ff9f43;
      --accent-red: #ff6b6b;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 10px 24px rgba(0, 0, 0, 0.35);
      --focus-ring: 0 0 0 3px rgba(88, 166, 255, 0.35);
    }

    /* ==================== 2. 基礎排版與跨裝置重置 ==================== */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
      background-color: var(--bg-page);
      color: var(--text-primary);
      line-height: 1.5;
      padding-bottom: calc(28px + env(safe-area-inset-bottom));
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
    }

    /* ==================== 3. 頂部氣象導覽橫幅 ==================== */
    .hero-header {
      background: var(--bg-header);
      color: #ffffff;
      padding: calc(16px + env(safe-area-inset-top)) 16px 18px;
      box-shadow: 0 4px 16px rgba(10, 35, 66, 0.22);
    }

    .container {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
    }

    .hero-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-badge {
      width: 54px;
      height: 54px;
      padding: 4px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(8, 25, 48, 0.22);
    }

    .brand-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    @media (min-width: 640px) {
      .brand-badge {
        width: 62px;
        height: 62px;
      }
    }

    .brand-title {
      margin: 0;
      font-size: clamp(1.12rem, 2.2vw, 1.5rem);
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .brand-subtitle {
      margin: 2px 0 0;
      font-size: 0.84rem;
      color: rgba(255, 255, 255, 0.86);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .env-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .env-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffd54f;
    }

    .env-badge.is-line .env-dot {
      background: #06c755;
      box-shadow: 0 0 0 3px rgba(6, 199, 85, 0.28);
    }

    .icon-toggle-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 36px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.18s ease, transform 0.12s ease;
    }

    .icon-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.24);
    }

    .icon-toggle-btn:active {
      transform: scale(0.97);
    }

    /* ==================== 4. 搜尋列與置頂分類導覽列 ==================== */
    .sticky-toolbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(240, 245, 250, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 16px;
    }

    html[data-theme="dark"] .sticky-toolbar {
      background: rgba(12, 23, 36, 0.92);
    }

    .toolbar-inner {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .search-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .search-box {
      position: relative;
      flex: 1 1 260px;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      font-size: 0.95rem;
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      min-height: 42px;
      padding: 8px 38px 8px 36px;
      border-radius: 11px;
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-primary);
      font-size: 0.94rem;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .search-input:focus {
      border-color: var(--accent-blue);
      box-shadow: var(--focus-ring);
    }

    .clear-search-btn {
      position: absolute;
      right: 8px;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 50%;
      background: var(--bg-pill);
      color: var(--text-secondary);
      font-size: 0.85rem;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .clear-search-btn.visible {
      display: inline-flex;
    }

    .count-summary {
      font-size: 0.82rem;
      color: var(--text-secondary);
      white-space: nowrap;
      font-weight: 500;
    }

    /* 橫向滑動分類頁籤（手機可順暢滑動，電腦與平板自動排列） */
    .category-tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .category-tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 38px;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-secondary);
      font-size: 0.86rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.18s ease;
    }

    .tab-pill:hover {
      background: var(--bg-pill);
      color: var(--text-primary);
    }

    .tab-pill.active {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
      color: #ffffff;
      box-shadow: 0 3px 10px rgba(21, 101, 192, 0.25);
    }

    /* ==================== 5. 主內容區與響應式網格系統 ==================== */
    .main-content {
      padding: 18px 16px 24px;
    }

    .favorites-panel {
      margin-bottom: 18px;
      padding: 14px 16px;
      border-radius: var(--radius-lg);
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }

    .favorites-panel.hidden {
      display: none;
    }

    .section-group {
      margin-bottom: 22px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--shadow-sm);
    }

    .section-group.hidden {
      display: none;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    .section-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .section-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      padding: 0 8px;
      border-radius: 8px;
      background: var(--bg-pill);
      color: var(--accent-blue);
      font-size: 0.82rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .section-title {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .section-tag {
      font-size: 0.76rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--bg-surface-soft);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      white-space: nowrap;
    }

    /* 響應式按鈕格線：
       - 手機 (< 560px)：1 欄（多項目緊湊好點）或 2 欄短按鈕，確保文字不擠壓折行
       - 大手機 / 小平板 (560px ~ 899px)：2 欄
       - 平板橫向 / 小筆電 (900px ~ 1179px)：3 欄
       - 筆電與一般桌機 (>= 1180px)：4 欄 */
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    @media (min-width: 520px) {
      .cards-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (min-width: 860px) {
      .cards-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }
      .hero-header {
        padding: 20px 24px 22px;
      }
      .sticky-toolbar {
        padding: 12px 24px;
      }
      .main-content {
        padding: 22px 24px 32px;
      }
      .toolbar-inner {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
      .search-row {
        flex: 0 0 340px;
      }
      .category-tabs {
        flex: 1;
        justify-content: flex-end;
      }
    }

    @media (min-width: 1160px) {
      .cards-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    /* ==================== 6. 單一服務按鈕卡片 ==================== */
    .service-card {
      position: relative;
      display: flex;
      align-items: stretch;
      background: var(--bg-surface-soft);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease, background-color 0.16s ease;
      overflow: hidden;
    }

    .service-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--accent-blue);
      background: var(--bg-surface);
    }

    .service-link {
      flex: 1;
      min-width: 0;
      min-height: 60px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 10px 12px 14px;
      cursor: pointer;
    }

    .service-link:focus-visible {
      outline: none;
      box-shadow: inset var(--focus-ring);
    }

    .service-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      background: var(--bg-pill);
    }

    .tone-warn .service-icon { background: rgba(198, 40, 40, 0.12); }
    .tone-typhoon .service-icon { background: rgba(230, 81, 0, 0.13); }
    .tone-ocean .service-icon { background: rgba(0, 137, 123, 0.13); }
    .tone-disaster .service-icon { background: rgba(106, 27, 154, 0.12); }

    .service-meta {
      flex: 1;
      min-width: 0;
    }

    .service-name {
      display: block;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
      word-break: keep-all;
    }

    .service-desc {
      display: block;
      margin-top: 2px;
      font-size: 0.76rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-actions {
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-left: 1px solid var(--border-color);
      background: transparent;
      flex-shrink: 0;
    }

    .mini-action-btn {
      width: 38px;
      flex: 1;
      min-height: 30px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .mini-action-btn:hover {
      background: var(--bg-pill);
      color: var(--accent-blue);
    }

    .mini-action-btn.is-fav {
      color: #f59e0b;
    }

    .mini-action-btn.send-line-btn {
      border-top: 1px solid var(--border-color);
      font-size: 0.82rem;
    }

    .mini-action-btn.send-line-btn.hidden {
      display: none;
    }

    /* ==================== 7. 空搜尋結果、LINE 工具列與頁尾 ==================== */
    .empty-state {
      display: none;
      text-align: center;
      padding: 46px 16px;
      background: var(--bg-surface);
      border: 1px dashed var(--border-color);
      border-radius: var(--radius-lg);
      color: var(--text-secondary);
    }

    .empty-state.visible {
      display: block;
    }

    .empty-state button {
      margin-top: 12px;
      padding: 8px 18px;
      border-radius: 999px;
      border: none;
      background: var(--accent-blue);
      color: #ffffff;
      font-weight: 600;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(20px);
      background: rgba(17, 34, 54, 0.94);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
      z-index: 100;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .page-footer {
      text-align: center;
      padding: 12px 16px 24px;
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .footer-maker {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .footer-sources {
      line-height: 1.55;
      max-width: 920px;
    }

    .footer-care {
      margin-top: 4px;
      padding: 8px 18px;
      border-radius: 999px;
      background: var(--bg-pill);
      border: 1px solid var(--border-color);
      color: var(--accent-blue);
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    /* ==================== 8. 縣市／鄉鎮選擇彈窗（跨裝置：手機底部抽屜／平板桌機置中視窗） ==================== */
    .picker-backdrop {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(8, 22, 40, 0.56);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
    }

    .picker-backdrop.open {
      display: flex;
    }

    .picker-modal {
      width: 100%;
      max-height: 88dvh;
      background: var(--bg-surface);
      color: var(--text-primary);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      border: 1px solid var(--border-color);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: sheetSlideUp 0.2s ease-out;
    }

    @keyframes sheetSlideUp {
      from { transform: translateY(20px); opacity: 0.6; }
      to { transform: translateY(0); opacity: 1; }
    }

    @media (min-width: 640px) {
      .picker-backdrop {
        align-items: center;
        padding: 20px;
      }
      .picker-modal {
        max-width: 780px;
        max-height: 84dvh;
        border-radius: 20px;
      }
    }

    .picker-header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-surface-soft);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .picker-header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .picker-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .picker-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 34px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--accent-blue);
      background: rgba(21, 101, 192, 0.1);
      color: var(--accent-blue);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .picker-back-btn.hidden {
      display: none;
    }

    .picker-title {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      min-width: 0;
    }

    .picker-county-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 10px;
      border-radius: 999px;
      background: var(--accent-blue);
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .picker-close-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-secondary);
      font-size: 1rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .picker-close-btn:hover {
      background: var(--bg-pill);
      color: var(--text-primary);
    }

    .picker-subnote-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--text-secondary);
    }

    .picker-overview-link {
      color: var(--accent-blue);
      font-weight: 700;
      white-space: nowrap;
    }

    .picker-overview-link:hover {
      text-decoration: underline;
    }

    .picker-search-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .picker-search-input {
      width: 100%;
      min-height: 40px;
      padding: 8px 34px 8px 34px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-primary);
      font-size: 0.9rem;
      outline: none;
    }

    .picker-search-input:focus {
      border-color: var(--accent-blue);
      box-shadow: var(--focus-ring);
    }

    .picker-body {
      padding: 14px 16px calc(18px + env(safe-area-inset-bottom));
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      flex: 1;
    }

    .picker-area-block {
      margin-bottom: 16px;
    }

    .picker-area-block:last-child {
      margin-bottom: 4px;
    }

      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 8px;
      padding-left: 8px;
      border-left: 3px solid var(--accent-blue);
    }

      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    @media (min-width: 480px) {
      .picker-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

        grid-template-columns: repeat(4, minmax(0, 1fr));

      align-items: stretch;
      border-radius: 10px;
      border: 1px solid var(--border-color);

      overflow: hidden;
      transition: transform 0.14s ease, border-color 0.14s ease, box-shadow 0.14s ease, background-color 0.14s ease;
    }

    .picker-item-wrap:hover {
      transform: translateY(-1px);
      border-color: var(--accent-blue);
      background: var(--bg-surface);
      box-shadow: var(--shadow-sm);
    }

    .picker-item-btn {
      flex: 1;
      min-width: 0;
      min-height: 46px;
      padding: 8px 10px;
      border: none;
      background: transparent;
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      text-align: left;

      background: transparent;
      color: var(--text-muted);

    // ==================== 2. 工具函式 ====================
    function loadFavorites() {
      try {
        const raw = localStorage.getItem("weather_liff_favorites_v1");
        return raw ? JSON.parse(raw) : [];
      } catch (err) {
        return [];
      }
    }

    function saveFavorites() {
      try {
        localStorage.setItem("weather_liff_favorites_v1", JSON.stringify(state.favorites));
      } catch (err) {
        // 忽略無痕模式儲存限制
      }
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2200);
    }

    function getAllItemsMap() {
      const map = new Map();
      MENU_SECTIONS.forEach((sec) => {
        sec.items.forEach((item) => map.set(item.id, item));
      });
      return map;
    }

    // ==================== 3. LIFF 初始化與跨裝置操作邏輯 ====================
    async function initLIFF() {
      const envBadge = document.getElementById("envBadge");
      const envText = document.getElementById("envText");

      if (typeof liff === "undefined") {
        envText.textContent = "跨裝置網頁模式";
        return;
      }

      // 若尚未填入正式 LIFF ID，仍可順暢於所有裝置瀏覽器使用
      if (!LIFF_ID || LIFF_ID === "填入你的_LIFF_ID") {
        state.isInLineClient = liff.isInClient ? liff.isInClient() : false;
        envText.textContent = state.isInLineClient ? "LINE 內建瀏覽器" : "跨裝置網頁模式";
        if (state.isInLineClient) {
          envBadge.classList.add("is-line");
        }
        renderAll();
        return;
      }

      try {
        await liff.init({ liffId: LIFF_ID });
        state.liffReady = true;
        state.isInLineClient = liff.isInClient();
        if (state.isInLineClient) {
          envBadge.classList.add("is-line");
          envText.textContent = "LINE LIFF 已連線";
        } else {
          envText.textContent = "跨裝置網頁模式";
        }
      } catch (err) {
        console.warn("LIFF 初始化未就緒，改採標準跨裝置網頁模式：", err);
        envText.textContent = "跨裝置網頁模式";
      }
      renderAll();
    }

    /**
     * 統一網址開啟輔助：LINE 內建環境以 liff.openWindow 開啟，一般瀏覽器直接另開新分頁
     */
    function openUrlSmart(url, title) {
      if (state.isInLineClient && typeof liff !== "undefined" && liff.openWindow) {
        liff.openWindow({
          url: url,
          external: state.externalOpenInLine
        });
        showToast("正在開啟：" + title);
      } else {
        window.open(url, "_blank", "noopener,noreferrer");
      }
    }

    /**
     * 開啟目標氣象／防災網址或行政區選單
     */
    function handleOpenService(event, item) {
      if (item.action === "county-picker") {
        event.preventDefault();
        openRegionPicker("county");
        return;
      }
      if (item.action === "town-picker") {
        event.preventDefault();
        openRegionPicker("town");
        return;
      }
      if (state.isInLineClient && typeof liff !== "undefined" && liff.openWindow) {
        event.preventDefault();
        openUrlSmart(item.url, item.name);
      }
    }

    function normalizeTwText(str) {
      return String(str || "").toLowerCase().replace(/台/g, "臺");
    }

    /**
     * 開啟「縣市／鄉鎮天氣預報」階層選單
     */
    function openRegionPicker(mode) {
      state.pickerMode = mode;
      state.pickerSelectedCounty = null;
      state.pickerKeyword = "";

      const backdrop = document.getElementById("pickerBackdrop");
      const searchInput = document.getElementById("pickerSearchInput");
      const clearBtn = document.getElementById("pickerClearBtn");
      searchInput.value = "";
      clearBtn.classList.remove("visible");

      renderPicker();
      backdrop.classList.add("open");
      document.body.style.overflow = "hidden";

      // 桌機／筆電自動聚焦搜尋欄，手機裝置避免強制彈出鍵盤遮擋列表
      if (window.innerWidth >= 860) {
        setTimeout(() => searchInput.focus(), 60);
      }
    }

    function closeRegionPicker() {
      const backdrop = document.getElementById("pickerBackdrop");
      backdrop.classList.remove("open");
      document.body.style.overflow = "";
      state.pickerMode = null;
      state.pickerSelectedCounty = null;
      state.pickerKeyword = "";
    }

    function createPickerOptionElement(label, subLabel, url, chatText, onClickAction) {
      const wrap = document.createElement("div");
      wrap.className = "picker-item-wrap";

      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "picker-item-btn";
      btn.addEventListener("click", onClickAction);

      const labelSpan = document.createElement("span");
      labelSpan.textContent = label;
      btn.appendChild(labelSpan);

      if (subLabel) {
        const subSpan = document.createElement("span");
        subSpan.className = "picker-item-sub";
        subSpan.textContent = subLabel;
        btn.appendChild(subSpan);
      }

      wrap.appendChild(btn);

      if (chatText) {
        const chatBtn = document.createElement("button");
        chatBtn.type = "button";
        chatBtn.className = "picker-line-chat-btn" + (state.isInLineClient ? "" : " hidden");
        chatBtn.title = "傳送至 LINE 聊天室";
        chatBtn.setAttribute("aria-label", "傳送" + label + "至 LINE 聊天室");
        chatBtn.textContent = "💬";
        chatBtn.addEventListener("click", () => sendServiceToLineChat(chatText));
        wrap.appendChild(chatBtn);
      }

      return wrap;
    }

    function renderPicker() {
      if (!state.pickerMode) return;

      const titleEl = document.getElementById("pickerTitle");
      const subnoteEl = document.getElementById("pickerSubnote");
      const backBtn = document.getElementById("pickerBackBtn");
      const overviewLink = document.getElementById("pickerOverviewLink");
      const searchInput = document.getElementById("pickerSearchInput");
      const bodyEl = document.getElementById("pickerBody");

      const kw = normalizeTwText(state.pickerKeyword.trim());
      bodyEl.innerHTML = "";

      // 若為「鄉鎮天氣預報」且已點選縣市：顯示該縣市鄉鎮市區選單，並在表頭清楚標示縣市名稱
      if (state.pickerMode === "town" && state.pickerSelectedCounty) {
        const county = state.pickerSelectedCounty;
        const townList = CWA_GEO.towns[county.id] || [];

        backBtn.classList.remove("hidden");
        titleEl.innerHTML = "";
        const countyPill = document.createElement("span");
        countyPill.className = "picker-county-pill";
        countyPill.textContent = "📍 " + county.name;
        const titleSuffix = document.createElement("span");
        titleSuffix.textContent = `鄉鎮市區列表（共 ${townList.length} 區）`;
        titleEl.appendChild(countyPill);
        titleEl.appendChild(titleSuffix);

        subnoteEl.textContent = `目前註解：以下為「${county.name}」所屬鄉鎮市區，點選後開啟逐 3 小時天氣預報`;
        overviewLink.href = `https://www.cwa.gov.tw/V8/C/W/County/County.html?CID=${county.id}`;
        overviewLink.textContent = `查看${county.name}全區預報 ↗`;
        searchInput.placeholder = `在「${county.name}」中搜尋鄉鎮市區...`;

        const filteredTowns = townList.filter((t) => !kw || normalizeTwText(t.name).includes(kw));
        if (filteredTowns.length === 0) {
          const empty = document.createElement("div");
          empty.className = "picker-empty";
          empty.textContent = `在「${county.name}」找不到符合「${state.pickerKeyword}」的鄉鎮市區`;
          bodyEl.appendChild(empty);
          return;
        }

        const grid = document.createElement("div");
        grid.className = "picker-grid";
        filteredTowns.forEach((town) => {
          const townUrl = `https://www.cwa.gov.tw/V8/C/W/Town/Town.html?TID=${town.id}`;
          grid.appendChild(
            createPickerOptionElement(
              town.name,
              "預報 ↗",
              townUrl,
              `${county.name}${town.name}天氣預報`,
              () => openUrlSmart(townUrl, `${county.name} ${town.name}天氣預報`)
            )
          );
        });
        bodyEl.appendChild(grid);
        return;
      }

      // 縣市列表選單（模式一「縣市天氣預報」或模式二「鄉鎮天氣預報」步驟 1）
      backBtn.classList.add("hidden");
      const isTownStep1 = state.pickerMode === "town";
      titleEl.textContent = isTownStep1 ? "🏘️ 鄉鎮天氣預報｜選擇縣市" : "🏙️ 縣市天氣預報｜選擇縣市";
      subnoteEl.textContent = isTownStep1
        ? "步驟 1/2：請先點選縣市，接著顯示該縣市所屬鄉鎮市區列表"
        : "請點選欲查詢的縣市（共 22 縣市），將開啟中央氣象署縣市天氣預報";
      overviewLink.href = isTownStep1
        ? "https://www.cwa.gov.tw/V8/C/W/Town/index.html"
        : "https://www.cwa.gov.tw/V8/C/W/County/index.html";
      overviewLink.textContent = isTownStep1 ? "前往全臺鄉鎮總覽 ↗" : "前往全臺縣市總覽 ↗";
      searchInput.placeholder = "輸入縣市名稱篩選（例如：台北、臺中、高雄）";

      const areaOrder = ["N", "C", "S", "E", "I"];
      let matchedTotal = 0;

      areaOrder.forEach((areaKey) => {
        const areaCounties = CWA_GEO.counties.filter(
          (c) => c.area === areaKey && (!kw || normalizeTwText(c.name).includes(kw))
        );
        if (areaCounties.length === 0) return;

        matchedTotal += areaCounties.length;

        const block = document.createElement("div");
        block.className = "picker-area-block";

        const areaLabel = document.createElement("div");
        areaLabel.className = "picker-area-label";
        areaLabel.textContent = CWA_AREA_NAMES[areaKey];
        block.appendChild(areaLabel);

        const grid = document.createElement("div");
        grid.className = "picker-grid";

        areaCounties.forEach((county) => {
          const townCount = (CWA_GEO.towns[county.id] || []).length;
          const countyUrl = `https://www.cwa.gov.tw/V8/C/W/County/County.html?CID=${county.id}`;
          grid.appendChild(
            createPickerOptionElement(
              county.name,
              isTownStep1 ? `${townCount} 區 ›` : "預報 ↗",
              countyUrl,
              isTownStep1 ? "" : `${county.name}天氣預報`,
              () => {
                if (isTownStep1) {
                  state.pickerSelectedCounty = county;
                  state.pickerKeyword = "";
                  searchInput.value = "";
                  document.getElementById("pickerClearBtn").classList.remove("visible");
                  renderPicker();
                  bodyEl.scrollTop = 0;
                } else {
                  openUrlSmart(countyUrl, `${county.name}天氣預報`);
                }
              }
            )
          );
        });

        block.appendChild(grid);
        bodyEl.appendChild(block);
      });

      if (matchedTotal === 0) {
        const empty = document.createElement("div");
        empty.className = "picker-empty";
        empty.textContent = `找不到符合「${state.pickerKeyword}」的縣市`;
        bodyEl.appendChild(empty);
      }
    }

    /**
     * 若處於 LINE LIFF 聊天室內，可一鍵將該項查詢文字送出至對話框
     */
    async function sendServiceToLineChat(itemName) {
      if (!state.isInLineClient || typeof liff === "undefined") {
        showToast("請於 LINE 聊天室開啟以使用傳送指令功能");
        return;
      }
      try {
        await liff.sendMessages([{ type: "text", text: "查詢" + itemName }]);
        liff.closeWindow();
      } catch (err) {
        console.error("傳送訊息失敗：", err);
        showToast("傳送失敗，請確認已開啟聊天室寫入權限");
      }
    }

    function toggleFavorite(itemId) {
      const idx = state.favorites.indexOf(itemId);
      if (idx >= 0) {
        state.favorites.splice(idx, 1);
        showToast("已從常用捷徑移除");
      } else {
        state.favorites.push(itemId);
        showToast("已加入常用捷徑");
      }
      saveFavorites();
      renderAll();
    }

    // ==================== 4. 動態畫面渲染與搜尋篩選 ====================
    function createServiceCardElement(item) {
      const card = document.createElement("div");
      card.className = "service-card" + (item.tone ? " tone-" + item.tone : "");

      const link = document.createElement("a");
      link.className = "service-link";
      link.href = item.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.addEventListener("click", (e) => handleOpenService(e, item));

      const iconEl = document.createElement("span");
      iconEl.className = "service-icon";
      iconEl.setAttribute("aria-hidden", "true");
      iconEl.textContent = item.icon;

      const metaEl = document.createElement("span");
      metaEl.className = "service-meta";

      const nameEl = document.createElement("span");
      nameEl.className = "service-name";
      nameEl.textContent = item.name;

      const descEl = document.createElement("span");
      descEl.className = "service-desc";
      descEl.textContent = item.desc;

      metaEl.appendChild(nameEl);
      metaEl.appendChild(descEl);
      link.appendChild(iconEl);
      link.appendChild(metaEl);

      // 右側快捷按鈕列（星號收藏 + LINE 聊天傳送）
      const actions = document.createElement("div");
      actions.className = "card-actions";

      const isFav = state.favorites.includes(item.id);
      const favBtn = document.createElement("button");
      favBtn.type = "button";
      favBtn.className = "mini-action-btn" + (isFav ? " is-fav" : "");
      favBtn.title = isFav ? "取消常用釘選" : "釘選至常用捷徑";
      favBtn.setAttribute("aria-label", favBtn.title);
      favBtn.textContent = isFav ? "★" : "☆";
      favBtn.addEventListener("click", () => toggleFavorite(item.id));

      const lineBtn = document.createElement("button");
      lineBtn.type = "button";
      lineBtn.className = "mini-action-btn send-line-btn" + (state.isInLineClient ? "" : " hidden");
      lineBtn.title = "傳送至 LINE 聊天室";
      lineBtn.setAttribute("aria-label", "傳送" + item.name + "至 LINE 聊天室");
      lineBtn.textContent = "💬";
      lineBtn.addEventListener("click", () => sendServiceToLineChat(item.name));

      actions.appendChild(favBtn);
      actions.appendChild(lineBtn);

      card.appendChild(link);
      card.appendChild(actions);
      return card;
    }

    function renderFavorites() {
      const panel = document.getElementById("favoritesPanel");
      const grid = document.getElementById("favoritesGrid");
      grid.innerHTML = "";

      if (state.keyword.trim() !== "" || state.activeCategory !== "all" || state.favorites.length === 0) {
        panel.classList.add("hidden");
        return;
      }

      const itemMap = getAllItemsMap();
      const validFavItems = state.favorites.map((id) => itemMap.get(id)).filter(Boolean);
      if (validFavItems.length === 0) {
        panel.classList.add("hidden");
        return;
      }

      validFavItems.forEach((item) => grid.appendChild(createServiceCardElement(item)));
      panel.classList.remove("hidden");
    }

    function renderAll() {
      renderFavorites();

      const container = document.getElementById("sectionsContainer");
      const emptyState = document.getElementById("emptyState");
      const emptyKeyword = document.getElementById("emptyKeyword");
      const countSummary = document.getElementById("countSummary");

      container.innerHTML = "";
      const kw = state.keyword.trim().toLowerCase();
      let visibleItemCount = 0;

      MENU_SECTIONS.forEach((section) => {
        if (state.activeCategory !== "all" && section.category !== state.activeCategory) {
          return;
        }

        const matchedItems = section.items.filter((item) => {
          if (!kw) return true;
          const haystack = `${section.title} ${item.name} ${item.desc} ${item.keywords}`.toLowerCase();
          return haystack.includes(kw);
        });

        if (matchedItems.length === 0) {
          return;
        }

        visibleItemCount += matchedItems.length;

        const secEl = document.createElement("section");
        secEl.className = "section-group";

        const headEl = document.createElement("div");
        headEl.className = "section-head";

        const titleWrap = document.createElement("div");
        titleWrap.className = "section-title-wrap";

        const numEl = document.createElement("span");
        numEl.className = "section-num";
        numEl.textContent = section.num;

        const titleEl = document.createElement("h2");
        titleEl.className = "section-title";
        titleEl.textContent = section.title;

        titleWrap.appendChild(numEl);
        titleWrap.appendChild(titleEl);

        const tagEl = document.createElement("span");
        tagEl.className = "section-tag";
        tagEl.textContent = `${section.categoryLabel} · ${matchedItems.length} 項`;

        headEl.appendChild(titleWrap);
        headEl.appendChild(tagEl);

        const gridEl = document.createElement("div");
        gridEl.className = "cards-grid";
        matchedItems.forEach((item) => gridEl.appendChild(createServiceCardElement(item)));

        secEl.appendChild(headEl);
        secEl.appendChild(gridEl);
        container.appendChild(secEl);
      });

      countSummary.textContent = `顯示 ${visibleItemCount} 項服務`;

      if (visibleItemCount === 0) {
        emptyKeyword.textContent = state.keyword.trim() || "所選分類";
        emptyState.classList.add("visible");
      } else {
        emptyState.classList.remove("visible");
      }
    }

    // ==================== 5. 互動事件與快捷鍵繫結 ====================
    function setupEvents() {
      const searchInput = document.getElementById("searchInput");
      const clearBtn = document.getElementById("clearSearchBtn");
      const resetFilterBtn = document.getElementById("resetFilterBtn");
      const categoryTabs = document.getElementById("categoryTabs");
      const themeToggleBtn = document.getElementById("themeToggleBtn");
      const themeText = document.getElementById("themeText");
      const openModeBtn = document.getElementById("openModeBtn");
      const openModeText = document.getElementById("openModeText");

      // 恢復主題設定
      try {
        const savedTheme = localStorage.getItem("weather_liff_theme_v1");
        if (savedTheme === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
          themeText.textContent = "淺色模式";
        }
      } catch (err) {}

      themeToggleBtn.addEventListener("click", () => {
        const isDark = document.documentElement.getAttribute("data-theme") === "dark";
        if (isDark) {
          document.documentElement.removeAttribute("data-theme");
          themeText.textContent = "深色模式";
          try { localStorage.setItem("weather_liff_theme_v1", "light"); } catch (err) {}
        } else {
          document.documentElement.setAttribute("data-theme", "dark");
          themeText.textContent = "淺色模式";
          try { localStorage.setItem("weather_liff_theme_v1", "dark"); } catch (err) {}
        }
      });

      openModeBtn.addEventListener("click", () => {
        state.externalOpenInLine = !state.externalOpenInLine;
        openModeText.textContent = state.externalOpenInLine ? "外部瀏覽器" : "LINE 內開啟";
        showToast(state.externalOpenInLine ? "LINE 中點擊將以外部瀏覽器開啟" : "LINE 中點擊將於內建視窗開啟");
      });

      searchInput.addEventListener("input", () => {
        state.keyword = searchInput.value;
        clearBtn.classList.toggle("visible", state.keyword.length > 0);
        renderAll();
      });

      clearBtn.addEventListener("click", () => {
        searchInput.value = "";
        state.keyword = "";
        clearBtn.classList.remove("visible");
        searchInput.focus();
        renderAll();
      });

      resetFilterBtn.addEventListener("click", () => {
        searchInput.value = "";
        state.keyword = "";
        state.activeCategory = "all";
        clearBtn.classList.remove("visible");
        categoryTabs.querySelectorAll(".tab-pill").forEach((btn) => {
          const active = btn.dataset.cat === "all";
          btn.classList.toggle("active", active);
          btn.setAttribute("aria-selected", active ? "true" : "false");
        });
        renderAll();
      });

      categoryTabs.addEventListener("click", (e) => {
        const btn = e.target.closest(".tab-pill");
        if (!btn) return;
        state.activeCategory = btn.dataset.cat;
        categoryTabs.querySelectorAll(".tab-pill").forEach((tab) => {
          const isActive = tab === btn;
          tab.classList.toggle("active", isActive);
          tab.setAttribute("aria-selected", isActive ? "true" : "false");
        });
        renderAll();
      });

      // 電腦／筆電鍵盤快捷鍵：按「/」或「Ctrl+K」快速聚焦搜尋框；「Esc」關閉縣市鄉鎮選單
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && state.pickerMode) {
          closeRegionPicker();
          return;
        }
        if ((e.key === "/" || (e.ctrlKey && e.key.toLowerCase() === "k")) && document.activeElement !== searchInput && !state.pickerMode) {
          e.preventDefault();
          searchInput.focus();
        }
      });

      // 縣市與鄉鎮選單互動事件
      const pickerBackdrop = document.getElementById("pickerBackdrop");
      const pickerCloseBtn = document.getElementById("pickerCloseBtn");
      const pickerBackBtn = document.getElementById("pickerBackBtn");
      const pickerSearchInput = document.getElementById("pickerSearchInput");
      const pickerClearBtn = document.getElementById("pickerClearBtn");
      const pickerOverviewLink = document.getElementById("pickerOverviewLink");

      pickerCloseBtn.addEventListener("click", closeRegionPicker);
      pickerBackdrop.addEventListener("click", (e) => {
        if (e.target === pickerBackdrop) {
          closeRegionPicker();
        }
      });

      pickerBackBtn.addEventListener("click", () => {
        state.pickerSelectedCounty = null;
        state.pickerKeyword = "";
        pickerSearchInput.value = "";
        pickerClearBtn.classList.remove("visible");
        renderPicker();
      });

      pickerSearchInput.addEventListener("input", () => {
        state.pickerKeyword = pickerSearchInput.value;
        pickerClearBtn.classList.toggle("visible", state.pickerKeyword.length > 0);
        renderPicker();
      });

      pickerClearBtn.addEventListener("click", () => {
        pickerSearchInput.value = "";
        state.pickerKeyword = "";
        pickerClearBtn.classList.remove("visible");
        pickerSearchInput.focus();
        renderPicker();
      });

      pickerOverviewLink.addEventListener("click", (e) => {
        if (state.isInLineClient && typeof liff !== "undefined" && liff.openWindow) {
          e.preventDefault();
          openUrlSmart(pickerOverviewLink.href, pickerOverviewLink.textContent);
        }
      });
    }

    /**
     * 依據左上角 LOGO 圖片檔名自動同步頁尾製作者與底部關懷標語
     */
    function applyLogoBranding() {
      const logoImg = document.getElementById("brandLogoImg");
      if (!logoImg) return;
      const rawSrc = decodeURIComponent(logoImg.getAttribute("src") || "");
      const fileName = rawSrc.split("/").pop().split("\\").pop();
      const logoStem = fileName.replace(/\.[^.]+$/, "").trim() || "氣象報報";

      const makerEl = document.getElementById("makerBrand");
      const careEl = document.getElementById("careBrand");
      if (makerEl) makerEl.textContent = logoStem;
      if (careEl) careEl.textContent = logoStem;
    }

    // 啟動頁面
    applyLogoBranding();
    setupEvents();
    renderAll();
    initLIFF();
  </script>
</body>
</html>

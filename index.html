<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#7ec8f8" />
  <title>氣象報報｜寵物氣象寶寶歡迎您</title>
  <style>
    /* ==================== 1. 全域可愛天空色彩變數 ==================== */
    :root {
      --sky-top: #cbeaff;
      --sky-mid: #e6f5ff;
      --sky-bottom: #fff8e7;
      --card-bg: rgba(255, 255, 255, 0.78);
      --card-border: rgba(255, 255, 255, 0.92);
      --text-main: #1b365d;
      --text-sub: #4b688a;
      --accent-sun: #ff9f1c;
      --accent-sky: #1d8cf8;
      --accent-pink: #ff6b9d;
      --shadow-soft: 0 18px 45px rgba(34, 98, 165, 0.14);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      min-height: 100dvh;
      font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text-main);
      background: linear-gradient(175deg, var(--sky-top) 0%, var(--sky-mid) 52%, var(--sky-bottom) 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
      padding: calc(14px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
    }

    /* ==================== 2. 漂浮白雲與太陽裝飾背景 ==================== */
    .sky-decor {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .sun-glow {
      position: absolute;
      top: -60px;
      right: -40px;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 224, 115, 0.85) 0%, rgba(255, 200, 75, 0.32) 55%, rgba(255, 200, 75, 0) 75%);
      animation: pulseSun 5s ease-in-out infinite;
    }

    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.72);
      border-radius: 999px;
      filter: blur(1px);
      box-shadow: 0 8px 20px rgba(120, 180, 230, 0.15);
    }

    .cloud::before, .cloud::after {
      content: "";
      position: absolute;
      background: inherit;
      border-radius: 50%;
    }

    .cloud-1 {
      width: 150px;
      height: 46px;
      top: 12%;
      left: 6%;
      animation: floatCloud 18s ease-in-out infinite alternate;
    }
    .cloud-1::before { width: 64px; height: 64px; top: -28px; left: 22px; }
    .cloud-1::after { width: 52px; height: 52px; top: -20px; right: 24px; }

    .cloud-2 {
      width: 190px;
      height: 54px;
      top: 24%;
      right: 5%;
      opacity: 0.65;
      animation: floatCloud 22s ease-in-out infinite alternate-reverse;
    }
    .cloud-2::before { width: 78px; height: 78px; top: -34px; left: 32px; }
    .cloud-2::after { width: 62px; height: 62px; top: -24px; right: 28px; }

    .cloud-3 {
      width: 130px;
      height: 40px;
      bottom: 16%;
      left: 10%;
      opacity: 0.55;
      animation: floatCloud 15s ease-in-out infinite alternate;
    }
    .cloud-3::before { width: 56px; height: 56px; top: -24px; left: 20px; }
    .cloud-3::after { width: 44px; height: 44px; top: -16px; right: 18px; }

    @keyframes floatCloud {
      from { transform: translateX(-14px) translateY(0); }
      to { transform: translateX(18px) translateY(-6px); }
    }

    @keyframes pulseSun {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    /* ==================== 3. 頂部品牌列 ==================== */
    .top-bar {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-chip {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px 6px 8px;
      border-radius: 999px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      box-shadow: 0 4px 14px rgba(34, 98, 165, 0.1);
      backdrop-filter: blur(8px);
    }

    .brand-logo-wrap {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: #ffffff;
      padding: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      flex-shrink: 0;
    }

    .brand-logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .brand-chip-text {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .brand-chip-title {
      font-size: 0.96rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .brand-chip-sub {
      font-size: 0.72rem;
      color: var(--text-sub);
      font-weight: 600;
    }

    .direct-skip-link {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--accent-sky);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 8px 14px;
      border-radius: 999px;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(34, 98, 165, 0.08);
      transition: transform 0.15s ease, background-color 0.15s ease;
      white-space: nowrap;
    }

    .direct-skip-link:hover {
      background: #ffffff;
      transform: translateY(-1px);
    }

    /* ==================== 4. 中央寵物氣象寶寶互動主舞台 ==================== */
    .stage-wrap {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 0;
    }

    .welcome-card {
      width: 100%;
      max-width: 560px;
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 32px;
      padding: 22px 20px 24px;
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .speech-bubble {
      position: relative;
      background: #ffffff;
      border: 2px solid #9fd3ff;
      border-radius: 22px;
      padding: 13px 18px;
      box-shadow: 0 8px 20px rgba(29, 140, 248, 0.12);
      max-width: 100%;
      margin-bottom: 14px;
    }

    .speech-bubble::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -11px;
      transform: translateX(-50%) rotate(45deg);
      width: 18px;
      height: 18px;
      background: #ffffff;
      border-right: 2px solid #9fd3ff;
      border-bottom: 2px solid #9fd3ff;
    }

    .speech-text {
      margin: 0;
      font-size: clamp(1rem, 2.8vw, 1.18rem);
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.45;
    }

    .voice-btn {
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 38px;
      padding: 6px 16px;
      border-radius: 999px;
      border: 1.5px solid #ffd180;
      background: linear-gradient(135deg, #fff5dc 0%, #ffe8b3 100%);
      color: #a65400;
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 159, 28, 0.18);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .voice-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(255, 159, 28, 0.25);
    }

    .voice-btn:active {
      transform: scale(0.97);
    }

    .voice-btn.is-playing {
      border-color: var(--accent-pink);
      background: linear-gradient(135deg, #ffe8f1 0%, #ffd2e4 100%);
      color: #a81c52;
      animation: voicePulse 1.1s ease-in-out infinite;
    }

    @keyframes voicePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    /* 可愛寶寶 GIF 點擊入口 */
    .pet-link {
      position: relative;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      padding: 6px 12px 2px;
      border-radius: 26px;
      outline: none;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      -webkit-tap-highlight-color: transparent;
    }

    .pet-link:hover {
      transform: translateY(-5px) scale(1.02);
    }

    .pet-link:active {
      transform: scale(0.96);
    }

    .pet-link:focus-visible {
      box-shadow: 0 0 0 4px rgba(29, 140, 248, 0.35);
    }

    .pet-aura {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -48%);
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0%, rgba(154, 214, 255, 0.45) 55%, rgba(154, 214, 255, 0) 74%);
      pointer-events: none;
      z-index: 0;
    }

    .pet-gif {
      position: relative;
      z-index: 1;
      width: clamp(190px, 42vw, 275px);
      height: auto;
      max-height: 44dvh;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 12px 18px rgba(34, 98, 165, 0.18));
      user-select: none;
      -webkit-user-drag: none;
    }

    .pet-shadow {
      width: 140px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(35, 92, 150, 0.22) 0%, rgba(35, 92, 150, 0) 72%);
      margin-top: -6px;
    }

    .tap-cta {
      margin-top: 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      border-radius: 999px;
      background: linear-gradient(135deg, #1d8cf8 0%, #0f68d0 100%);
      color: #ffffff;
      font-size: 0.96rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      box-shadow: 0 8px 20px rgba(29, 140, 248, 0.32);
      animation: ctaBounce 2.2s ease-in-out infinite;
    }

    @keyframes ctaBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    .sub-hint {
      margin: 10px 0 0;
      font-size: 0.8rem;
      color: var(--text-sub);
      font-weight: 600;
    }

    /* ==================== 5. 頁尾 ==================== */
    .welcome-footer {
      position: relative;
      z-index: 2;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-sub);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .welcome-care {
      font-weight: 800;
      color: var(--text-main);
      font-size: 0.86rem;
    }

    /* 尊重使用者減少動態偏好 */
    @media (prefers-reduced-motion: reduce) {
      .cloud, .sun-glow, .tap-cta, .voice-btn.is-playing {
        animation: none;
      }
    }
  </style>
</head>
<body>

  <!-- 柔和天空與白雲裝飾 -->
  <div class="sky-decor" aria-hidden="true">
    <div class="sun-glow"></div>
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
  </div>

  <!-- 頂部品牌識別與快速跳轉 -->
  <header class="top-bar">
    <div class="brand-chip">
      <div class="brand-logo-wrap">
        <img id="welcomeLogoImg" class="brand-logo-img" src="LOGO/氣象報報.png" alt="氣象報報 LOGO" />
      </div>
      <div class="brand-chip-text">
        <span id="welcomeBrandName" class="brand-chip-title">氣象報報</span>
        <span class="brand-chip-sub">智慧氣象海象與防災小站</span>
      </div>
    </div>

    <a class="direct-skip-link" href="Line_LIFFSDK.html">直接進入選單 ↗</a>
  </header>

  <!-- 中央寵物氣象寶寶歡迎區 -->
  <main class="stage-wrap">
    <section class="welcome-card" aria-label="寵物氣象寶寶歡迎畫面">
      <div class="speech-bubble">
        <p class="speech-text">「我是你的寵物氣象寶寶，請點擊我一下呦！」</p>
        <button id="playVoiceBtn" class="voice-btn" type="button" aria-label="播放寵物氣象寶寶語音">
          <span id="voiceIcon" aria-hidden="true">🔊</span>
          <span id="voiceBtnText">聽寶寶說話</span>
        </button>
      </div>

      <!-- 點擊 GIF 圖片立即連接至 Line_LIFFSDK.html -->
      <a id="petEntryLink" class="pet-link" href="Line_LIFFSDK.html" aria-label="點擊寵物氣象寶寶進入氣象資訊選單">
        <span class="pet-aura" aria-hidden="true"></span>
        <img
          class="pet-gif"
          src="WeatwerPetdoll/氣象報報(寶寶).gif"
          alt="寵物氣象寶寶動態圖片"
        />
        <span class="pet-shadow" aria-hidden="true"></span>
        <span class="tap-cta">👆 點擊寶寶進入氣象資訊站</span>
      </a>

      <p class="sub-hint">支援一般電腦、筆電、平板、手機與 LINE 內建瀏覽器</p>
    </section>
  </main>

  <!-- 底部署名與關懷語 -->
  <footer class="welcome-footer">
    <div>製作者：<span id="footerMakerBrand">氣象報報</span>、SimonMa</div>
    <div class="welcome-care"><span id="footerCareBrand">氣象報報</span> 關心您！ 天氣多變化，記得點擊寶寶查看最新預報喔</div>
  </footer>

  <!-- 可愛女寶寶語音檔 -->
  <audio id="petVoiceAudio" src="WeatwerPetdoll/pet_baby_voice.mp3" preload="auto"></audio>

  <script>
    (function () {
      const audio = document.getElementById("petVoiceAudio");
      const playVoiceBtn = document.getElementById("playVoiceBtn");
      const voiceBtnText = document.getElementById("voiceBtnText");
      const voiceIcon = document.getElementById("voiceIcon");
      const petEntryLink = document.getElementById("petEntryLink");

      let hasAutoPlayedOnGesture = false;

      // 依 LOGO 檔名同步品牌文字
      const logoImg = document.getElementById("welcomeLogoImg");
      if (logoImg) {
        const rawSrc = decodeURIComponent(logoImg.getAttribute("src") || "");
        const stem = rawSrc.split("/").pop().split("\\").pop().replace(/\.[^.]+$/, "").trim() || "氣象報報";
        const brandEl = document.getElementById("welcomeBrandName");
        const makerEl = document.getElementById("footerMakerBrand");
        const careEl = document.getElementById("footerCareBrand");
        if (brandEl) brandEl.textContent = stem;
        if (makerEl) makerEl.textContent = stem;
        if (careEl) careEl.textContent = stem;
      }

      function setPlayingUI(playing) {
        playVoiceBtn.classList.toggle("is-playing", playing);
        voiceIcon.textContent = playing ? "🎵" : "🔊";
        voiceBtnText.textContent = playing ? "寶寶說話中..." : "再聽一次寶寶說話";
      }

      function speakFallback() {
        if (!("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance("我是你的寵物氣象寶寶，請點擊我一下呦！");
        utter.lang = "zh-TW";
        utter.pitch = 1.65;
        utter.rate = 1.05;
        utter.onstart = () => setPlayingUI(true);
        utter.onend = () => setPlayingUI(false);
        window.speechSynthesis.speak(utter);
      }

      async function playBabyVoice(fromAutoplay) {
        if (!audio) return;
        try {
          audio.currentTime = 0;
          await audio.play();
          setPlayingUI(true);
          hasAutoPlayedOnGesture = true;
        } catch (err) {
          // 瀏覽器阻擋首次自動播放時，顯示溫馨提示並於第一次碰觸頁面（非 GIF 直接跳轉時）補播
          if (fromAutoplay) {
            voiceBtnText.textContent = "點一下聽寶寶打招呼";
          } else {
            speakFallback();
          }
        }
      }

      audio.addEventListener("ended", () => setPlayingUI(false));
      audio.addEventListener("error", () => {
        playVoiceBtn.addEventListener("click", speakFallback, { once: true });
      });

      playVoiceBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        playBabyVoice(false);
      });

      // 若瀏覽器擋下自動播放，使用者點選空白處或對話框即自動播放語音（點選 GIF 本身則直接跳轉不阻擋）
      function handleFirstGesture(e) {
        if (hasAutoPlayedOnGesture) return;
        if (petEntryLink && petEntryLink.contains(e.target)) return;
        playBabyVoice(false);
        document.removeEventListener("pointerdown", handleFirstGesture);
      }
      document.addEventListener("pointerdown", handleFirstGesture);

      // 頁面載入後嘗試自動播放可愛女寶寶語音
      window.addEventListener("DOMContentLoaded", () => {
        playBabyVoice(true);
      });
    })();
  </script>
</body>
</html>
